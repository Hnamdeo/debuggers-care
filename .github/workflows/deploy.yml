# Builds the app whenever main changes (i.e. when a PR is merged) and saves the
# ready-to-serve files to the `deploy` branch. Hostinger's Git deploy (hPanel >
# Advanced > Git) pulls that branch into the care folder; a GitHub webhook tells
# Hostinger to pull after every update. (Hostinger's FTP does not accept
# connections from GitHub's servers, so we can't push by FTP.)
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-care
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Save the built site to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" deploy
