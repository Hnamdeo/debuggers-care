# Builds the app whenever main changes (i.e. when a PR is merged) and sends the
# built site to care.debuggersspace.com/deploy.php, which puts it live.
# Hostinger's FTP does not accept connections from GitHub's servers, so the
# server receives the files over HTTPS instead. The secret CARE_DEPLOY_KEY must
# match the text in public_html/care/api/data/deploy.key on the server.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-care
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Zip the built site (clinic data folder left out)
        run: cd dist && zip -qr ../site.zip . -x 'api/data/*'
      - name: Send it to the server
        env:
          KEY: ${{ secrets.CARE_DEPLOY_KEY }}
        run: |
          test -n "$KEY" || { echo "Add the CARE_DEPLOY_KEY secret in the repo settings first."; exit 1; }
          curl -fsS --retry 3 --max-time 120 -X POST \
            -H "X-Deploy-Key: $KEY" -H "Content-Type: application/zip" \
            --data-binary @site.zip https://care.debuggersspace.com/deploy.php
