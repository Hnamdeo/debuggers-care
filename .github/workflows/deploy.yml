# Publishes the app to Hostinger whenever main changes (i.e. when a PR is merged).
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (from hPanel > Files > FTP Accounts)
# Use a separate FTP account whose directory is /public_html/care, so this job can
# only touch the app folder; it then uploads to the account's own root (./).
# Optional repository variable FTP_DIR overrides that, e.g. public_html/care/ for the
# main FTP account.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-care
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the FTP server answers
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          host="$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#[/:].*$##' | tr -d '[:space:]')"
          for h in "$host" ftp.debuggersspace.com debuggersspace.com; do
            echo "== $h ($(getent hosts "$h" | awk '{print $1}' | head -1))"
            if timeout 15 bash -c "exec 3<>/dev/tcp/$h/21; head -c 120 <&3"; then echo; echo "port 21 answered"; else echo "port 21 no answer"; fi
          done
      - name: Upload to Hostinger (only changed files)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './' }}
          timeout: 120000
          log-level: verbose
